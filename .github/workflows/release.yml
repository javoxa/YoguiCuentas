name: Build release packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  numerics:
    uses: ./.github/workflows/numerics.yml

  linux:
    name: Debian/Devuan package
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Build .deb
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          test "${RELEASE_TAG#v}" = "$VERSION"
          bash construir_deb.sh
      - name: Upload Linux package
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: dist/yoguicuentas_*_all.deb
          if-no-files-found: error

  macos:
    name: macOS Apple Silicon app
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Verify Swift and Metal numerical contracts
        run: bash metal/yoguicuentas_metal/verificar_numerica.sh verification/ci full
      - name: Preserve macOS verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: numerical-macos
          path: metal/yoguicuentas_metal/verification/ci/
          if-no-files-found: warn
      - name: Build app bundle
        env:
          YOGUI_SKIP_OPEN: '1'
        run: bash metal/yoguicuentas_metal/crear_app.sh "$RUNNER_TEMP/YoguiCuentas Metal.app"
      - name: Package app bundle
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/YoguiCuentas Metal.app" \
            "dist/YoguiCuentas_Metal_macOS_arm64.zip"
      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: dist/YoguiCuentas_Metal_macOS_arm64.zip
          if-no-files-found: error

  publish:
    name: Attach assets to GitHub Release
    needs: [numerics, linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release notes
        uses: actions/checkout@v7
      - name: Download packages
        uses: actions/download-artifact@v6
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Include technical report
        run: |
          cp metal/technical_report/informe_tecnico_yoguicuentas_metal.pdf dist/YoguiCuentas_Informe_tecnico_Metal_0.11.0.pdf
          cp output/pdf/yoguicuentas_paper_20261030.pdf dist/YoguiCuentas_Paper_ES.pdf
          cp output/pdf/yoguicuentas_paper_en.pdf dist/YoguiCuentas_Paper_EN.pdf
          cp LICENSE NOTICE dist/
          cp INFORME_VALIDACION_CPU_GPU_20261029.md PREPARACION_PRODUCCION.md dist/
      - name: Create checksums
        run: (cd dist && sha256sum * > SHA256SUMS)
      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: sed "s/@VERSION@/${RELEASE_TAG#v}/g" RELEASE_NOTES.md > "$RUNNER_TEMP/release-notes.md"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "YoguiCuentas $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
